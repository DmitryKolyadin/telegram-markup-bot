<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Markdown Input</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            margin: 0;
            padding: 16px;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            display: flex;
            flex-direction: column;
            height: 100vh;
            box-sizing: border-box;
        }
        
        textarea {
            flex-grow: 1;
            width: 100%;
            margin-bottom: 16px;
            padding: 12px;
            border: 1px solid var(--tg-theme-hint-color, #cccccc);
            border-radius: 8px;
            resize: none;
            font-family: monospace;
            font-size: 14px;
            background-color: var(--tg-theme-secondary-bg-color, #f5f5f5);
            color: var(--tg-theme-text-color, #000000);
            outline: none;
            box-sizing: border-box;
        }
        
        .buttons {
            display: flex;
            gap: 10px;
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: opacity 0.2s;
            flex: 1;
        }
        
        button:active {
            opacity: 0.7;
        }

        #paste-btn {
            background-color: var(--tg-theme-secondary-bg-color, #e0e0e0);
            color: var(--tg-theme-text-color, #000000);
        }

        #send-btn {
            background-color: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #ffffff);
        }
        
        .loader {
            display: none;
            text-align: center;
            margin-top: 10px;
            color: var(--tg-theme-hint-color, #888888);
            font-size: 14px;
        }
    </style>
</head>
<body>

    <textarea id="input-text" placeholder="Type or paste your Markdown here..."></textarea>
    
    <div class="loader" id="loader">Uploading...</div>

    <div class="buttons">
        <button id="paste-btn">Paste from Clipboard</button>
        <button id="send-btn">Send to Bot</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        
        const pasteBtn = document.getElementById('paste-btn');
        const sendBtn = document.getElementById('send-btn');
        const input = document.getElementById('input-text');
        const loader = document.getElementById('loader');

        // Initial focus
        input.focus();

        pasteBtn.addEventListener('click', async () => {
            try {
                // Try modern Clipboard API
                const text = await navigator.clipboard.readText();
                if (text) {
                    input.value = text;
                    tg.HapticFeedback.notificationOccurred('success');
                } else {
                    tg.showAlert("Clipboard is empty or access denied.");
                }
            } catch (err) {
                // Fallback or error handling
                tg.showAlert("Could not read clipboard. Please paste manually.");
            }
        });

        sendBtn.addEventListener('click', async () => {
            const content = input.value.trim();
            if (!content) {
                tg.HapticFeedback.notificationOccurred('error');
                return;
            }

            // UI state
            sendBtn.disabled = true;
            loader.style.display = 'block';

            try {
                // Upload to paste.c-net.org (Simplest API, no validation)
                const response = await fetch('https://paste.c-net.org/', {
                    method: 'POST',
                    body: content
                });

                if (response.ok) {
                    let url = await response.text();
                    url = url.trim();
                    // Returns just the URL: https://paste.c-net.org/XXXXX
                    
                    tg.HapticFeedback.notificationOccurred('success');
                    tg.switchInlineQuery(url);
                } else {
                    const errText = await response.text();
                    console.error("Upload error:", errText);
                    tg.showAlert("Upload failed. Please try again.");
                    throw new Error("Upload failed");
                }
            } catch (err) {
                tg.showAlert("Failed to upload text. Please try again.");
                console.error(err);
                sendBtn.disabled = false;
                loader.style.display = 'none';
            }
        });
    </script>
</body>
</html>
