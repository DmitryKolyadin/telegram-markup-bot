name: Deploy Serverless Service - bot

on:
  push:
    branches:
      - main
    paths:
        - "bot/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SERVICE_PATH: bot
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Write credentials
      working-directory: ${{ env.SERVICE_PATH }}
      run: |
        printf "%s" '${{ secrets.SA_JSON_CREDENTIALS }}' > .yc
        printf "%s" '${{ secrets.YAPPA }}' > yappa.yaml
        
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: 3.11

    - name: Install Yappa
      working-directory: ${{ env.SERVICE_PATH }}
      run: |
        python -m pip install --upgrade pip
        pip install yappa

    - name: Yappa Deploy
      working-directory: ${{ env.SERVICE_PATH }}
      run: |
        yappa deploy